name: recover-npm-token

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Identify the token owner and writable packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- whoami ---"
          npm whoami --registry=https://registry.npmjs.org || true
          echo "--- writable packages ---"
          npm access list packages --registry=https://registry.npmjs.org || true
      - name: Copy the token into dsh-defend's secret
        env:
          GH_TOKEN: ${{ secrets.RECOVER_GH_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          gh secret set NPM_TOKEN --repo PerryLink/dsh-defend --body "$NPM_TOKEN"
          gh secret list --repo PerryLink/dsh-defend
