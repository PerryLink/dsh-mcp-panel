name: release

# TEMPORARY OIDC probe (replaces the real release pipeline for one dispatch):
# performs exactly the token exchange `pnpm publish --provenance` performs —
# GitHub OIDC token -> npm short-lived token — and reports success or failure
# WITHOUT printing the token and WITHOUT publishing anything. Restored to the
# real release.yml immediately after the check.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange GitHub OIDC token with the npm registry
        run: |
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm%3Aregistry.npmjs.org" | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
            echo "::error::could not obtain a GitHub OIDC token for the npm audience"
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $oidc" https://registry.npmjs.org/-/npm/v1/tokens)
          echo "npm token exchange HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::npm OIDC token exchange failed (status $code) — the publisher is not registered on npm for this repository/workflow, or the form fields do not match"
            exit 1
          fi
          echo "npm OIDC publisher is registered and the exchange works"
