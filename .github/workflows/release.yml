name: release

# TEMPORARY OIDC probe: exchanges the GitHub OIDC token at the real npm
# endpoint (/-/npm/v1/oidc/token/exchange/package/<name>). Success prints only
# the HTTP status (the response token is never printed); failure prints the
# npm error body (contains no secrets). Restored right after the check.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange GitHub OIDC token with the npm registry
        run: |
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm%3Aregistry.npmjs.org" | jq -r '.value')
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
            echo "::error::could not obtain a GitHub OIDC token for the npm audience"
            exit 1
          fi
          resp=$(mktemp)
          code=$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $oidc" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-mcp-panel)
          echo "npm OIDC exchange HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "--- npm error body ---"
            cat "$resp"
            echo "--- end body ---"
            exit 1
          fi
          echo "npm OIDC publisher is registered and the exchange works"
