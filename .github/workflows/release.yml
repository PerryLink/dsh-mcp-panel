name: release

# Publish pipeline for a `v*` tag pushed to main: re-runs the full gate,
# refuses to publish when the tag does not name the package version, publishes
# to npm with provenance, and creates a GitHub Release whose notes are the
# matching CHANGELOG section. See CONTRIBUTING.md §Release for the local flow
# (`scripts/release.mjs` prepares the commit + tag; this workflow ships it).

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No `registry-url` on purpose. It makes setup-node write a
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` line, and any
          # configured bearer token is preferred over the OIDC exchange — the
          # registry then answers 404 on PUT instead of letting npm do the
          # exchange. Worse, npm words a FAILED OIDC exchange as a 404 too, so the
          # existence probe below cannot tell "not published yet" from "not
          # authorised" and would silently skip a real publish. Trusted publishing
          # reads no secret, and the probe is now a hard gate.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse mismatched tag/version
        run: node scripts/check-tag-version.mjs "$GITHUB_REF_NAME"
      - name: Gate
        run: |
          pnpm run typecheck:ci
          pnpm test
          pnpm run build
          pnpm run verify:self-contained
          pnpm run verify:artifacts
          pnpm pack
      - name: Publish to npm
        env:
          # npm's OIDC exchange swallows its own failures: without verbose they
          # surface only as ENEEDAUTH with no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          # Idempotent: a manual publish of the same version (or a re-run after a
          # flaky step) must not fail the release. The existence check is an
          # ANONYMOUS read, so it is independent of whatever credentials npm
          # holds; a 200 means the version really is on the registry.
          #
          # The earlier shape fed `NODE_AUTH_TOKEN: secrets.NPM_TOKEN` plus
          # `registry-url`. That made the bearer path win over trusted publishing,
          # and npm words BOTH a bad bearer token and a failed OIDC exchange as a
          # 404 on PUT — which this probe would read as "already published" and
          # skip. Trusted publishing (id-token: write, no secret) removes the
          # ambiguity; retire the NPM_TOKEN secret so it cannot come back.
          if curl -fsS "https://registry.npmjs.org/dsh-mcp-panel/$(node -p "require('./package.json').version")" >/dev/null 2>&1; then
            echo "version already on the registry; skipping publish"
          else
            npm publish --access public --provenance
            echo "published dsh-mcp-panel through trusted publishing"
          fi
      - name: Build release notes from the changelog section
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tgz'
          body_path: release-notes.md
          generate_release_notes: false
