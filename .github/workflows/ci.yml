name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The npm-resolved typecheck: registry-published 0.1.0-rc.6 type faces
      # (all @deepseek-ai/dsh-* devDeps), no checkout-relative tsconfig paths.
      # The local checkout typecheck (pnpm run typecheck) stays a dev-side gate.
      - run: pnpm run typecheck:ci
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:self-contained
      - run: pnpm run verify:artifacts
