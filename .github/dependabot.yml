version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the engines floor (Node 22); major bumps to the
      # 26.x line would describe APIs the supported runtime does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
