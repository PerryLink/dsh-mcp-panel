</defs>
<rect width="1100" height="660" fill="url(#bg)"/>
<text x="44" y="58" fill="#f0f3f9" font-family="'Consolas','SFMono-Regular','Menlo',ui-monospace,monospace" font-size="28" font-weight="700">dsh-mcp-panel</text>
