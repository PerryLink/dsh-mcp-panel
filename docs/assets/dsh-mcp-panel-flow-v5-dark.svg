<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-mcp-panel 结构图：左侧读取通道从 loader、工具注册表与 mcp/status 采集事实并输出快照；右侧写入通道把表单操作渲染成只追加片段，经审批、备份、追加与 loader 复验；顶部回程把落盘的 patch 经 loader 重放回实例">
